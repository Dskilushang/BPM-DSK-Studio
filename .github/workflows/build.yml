name: Build BPM-DSK-Studio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android et NDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle et compiler l'APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Générer l'APK Debug
        run: gradle assembleDebug

      - name: Publier l'APK prêt à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: BPM-DSK-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
